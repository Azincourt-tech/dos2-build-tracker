<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Guia visual de progressão de builds para Divinity Original Sin 2 — tracker interativo com checklist por nível." />
  <title>DOS2 Build Tracker</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  />

  <!-- Styles -->
  <link rel="stylesheet" href="style.css" />

  <!-- Favicon inline -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><polygon points='16,2 28,10 28,22 16,30 4,22 4,10' stroke='%23c8943a' stroke-width='2' fill='none'/><circle cx='16' cy='16' r='4' fill='%23c8943a'/></svg>" />
</head>
<body>

  <!-- App root — renderizado pelo script.js -->
  <div id="app-root" role="application" aria-label="DOS2 Build Tracker">
    <!-- Estado de loading inicial -->
    <div style="
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      min-height:100dvh;
      gap:1rem;
      color:#9b9175;
      font-family:'Cinzel',serif;
    ">
      <svg width="60" height="60" viewBox="0 0 32 32" fill="none" style="color:#c8943a;animation:spin 2s linear infinite">
        <polygon points="16,2 28,10 28,22 16,30 4,22 4,10" stroke="currentColor" stroke-width="1.5" fill="none"/>
        <circle cx="16" cy="16" r="3.5" fill="currentColor"/>
      </svg>
      <span style="font-size:1rem;letter-spacing:0.15em">Carregando builds…</span>
    </div>
  </div>

  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

  <!-- Script principal (defer garante que o DOM está pronto) -->
  <script src="script.js" defer></script>
</body>
</html>
